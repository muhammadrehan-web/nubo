<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/nubo.css?v=3" />
</head>
<body>
  <header class="nav">
    <div class="nav-bar">
      <a href="index.html"><img class="nav-logo" src="assets/I0IM9xzrz1Pwr8vHBfgEPDbj7LU.svg" alt="nubo" /></a>
      <button class="nav-toggle" type="button" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
    <div class="nav-panel">
      <nav class="nav-links">
        <a href="cases/index.html">Use cases</a><a href="about.html">About</a><a href="updates.html">Updates</a>
        <a href="waitlist.html">Waitlist</a><a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main class="page-hero">
    <div class="kicker kicker-left"><span class="ico dark"><img src="assets/k5boprw0JY9PVcw3y1yhpVp4Q.svg" alt="" /></span><span class="kicker-label">Updates</span></div>
    <h1 class="display h110">What’s new, and<br /><span class="grey">what changed.</span></h1>
    <p class="lede" style="text-align:left;margin-left:0">Nubo is in beta. This is where the work shows, as it ships.</p>
    <div class="sheet" style="margin-top:48px;display:flex;justify-content:space-between;align-items:center;gap:40px;background:var(--cream)">
      <div>
        <h3 class="display h32">Get the updates.</h3>
        <p class="caps">A note when something ships. Nothing else.</p>
      </div>
      <form style="flex:1" onsubmit="event.preventDefault();this.querySelector('button').textContent='SENT'">
        <div class="field"><small>Email</small><input type="email" required /></div>
        <button class="btn btn-muted" type="submit">Subscribe</button>
      </form>
    </div>
